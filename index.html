<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办簿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="list">

  <header class="site-header">
    <div class="brand">
      <h1 data-site-name>待办簿</h1>
      <p class="subtitle" data-tagline></p>
    </div>
    <div class="user-bar">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="btn-text" type="button">退出</button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="index.html" class="active">清单</a>
    <a href="chat.html"><span data-ai-name>小记</span></a>
  </nav>

  <main>

    <!-- 日历 -->
    <section class="panel calendar-card">
      <div class="cal-head">
        <button id="cal-prev" class="cal-arrow" type="button" aria-label="上个月">‹</button>
        <span id="cal-title" class="cal-title"></span>
        <button id="cal-next" class="cal-arrow" type="button" aria-label="下个月">›</button>
      </div>

      <div id="cal-grid" class="cal-grid"></div>

      <div class="day-panel">
        <div class="day-head">
          <span id="day-title" class="day-head-title"></span>
          <a id="day-add" class="btn-text" href="new.html">＋ 当天添加</a>
        </div>
        <div id="day-list" class="day-list"></div>
      </div>
    </section>

    <!-- 列表 -->
    <section class="panel">

      <div class="panel-head">
        <div class="tabs" id="kind-tabs">
          <button type="button" data-kind="long" class="active">
            <span class="tab-label">长期任务</span>
            <span class="tab-num">0</span>
          </button>
          <button type="button" data-kind="short">
            <span class="tab-label">短期任务</span>
            <span class="tab-num">0</span>
          </button>
        </div>
        <a class="btn-primary btn-link" href="new.html">＋ 新建待办</a>
      </div>

      <form id="add-form" class="add-form">
        <input id="new-title" type="text" maxlength="100" placeholder="写一件长期要做的事，按回车添加" required>
        <button id="add-btn" class="btn-ghost" type="submit">快速添加</button>
      </form>

      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索标题或说明">
        <label class="check">
          <input id="only-todo" type="checkbox"> 只看未完成
        </label>
      </div>

      <p id="count" class="count"></p>

      <p id="loading" class="state" hidden>加载中…</p>
      <p id="empty" class="state" hidden>这里还是空的</p>
      <div id="error" class="state error" hidden>
        <p id="error-msg"></p>
        <button id="retry" class="btn-ghost" type="button">重试</button>
      </div>

      <ul id="list" class="list" hidden></ul>

    </section>
  </main>

  <footer class="site-footer">
    <p><span data-site-name></span></p>
  </footer>

  <script src="config.js"></script>
  <script src="branding.js"></script>
  <script src="app.js"></script>
</body>
</html>
