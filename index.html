<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办簿</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("season")||"spring")}catch(e){document.documentElement.setAttribute("data-theme","spring")}</script>

  <link rel="stylesheet" href="style.css?v=20261123b">
</head>
<body data-page="list">

  <header class="site-header">
    <div class="brand">
      <h1 data-site-name>待办簿</h1>
      <p class="subtitle" data-tagline></p>
    </div>
    <div class="user-bar">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="btn-text" type="button">退出</button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="index.html" class="active">清单</a>
    <a href="calendar.html">日历</a>
    <a href="chat.html"><span data-ai-name>小记</span></a>
    <a href="guide.html">指南</a>
  </nav>

  <main>
    <section class="panel">

      <div class="panel-head">
        <div class="tabs" id="kind-tabs">
          <button type="button" data-kind="all" class="active">
            <span class="tab-label">全部</span>
            <span class="tab-num">0</span>
          </button>
          <button type="button" data-kind="long">
            <span class="tab-label">长期</span>
            <span class="tab-num">0</span>
          </button>
          <button type="button" data-kind="short">
            <span class="tab-label">短期</span>
            <span class="tab-num">0</span>
          </button>
        </div>
        <a class="btn-primary btn-link" href="new.html">＋ 新建待办</a>
      </div>

      <form id="add-form" class="add-form">
        <input id="new-title" type="text" maxlength="100" placeholder="写一件事，按回车添加" required>
        <input id="new-due" class="quick-due" type="datetime-local" title="填了时间就建成短期任务">
        <button id="add-btn" class="btn-ghost" type="submit">快速添加</button>
      </form>

      <div class="quick-extra">
        <button id="toggle-note" class="btn-text" type="button">＋ 说明</button>
        <span id="quick-hint" class="quick-hint">不填时间 = 长期任务；填了时间 = 短期任务</span>
      </div>
      <textarea id="new-note" class="quick-note" rows="2" maxlength="500"
                placeholder="补充说明（可选）" hidden></textarea>

      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索标题或说明（会跨类型搜）">
        <label class="check">
          <input id="only-todo" type="checkbox"> 只看未完成
        </label>
        <select id="sort-by" class="sort-select" title="排序方式">
          <option value="due">按时间</option>
          <option value="priority">按优先级</option>
          <option value="created">按创建</option>
          <option value="title">按标题</option>
        </select>
      </div>

      <p id="count" class="count"></p>

      <p id="loading" class="state" hidden>加载中…</p>
      <p id="empty" class="state" hidden>这里还是空的</p>
      <div id="error" class="state error" hidden>
        <p id="error-msg"></p>
        <button id="retry" class="btn-ghost" type="button">重试</button>
      </div>

      <ul id="list" class="list" hidden></ul>

      <div class="trash">
        <button id="trash-toggle" class="trash-toggle" type="button">
          <span class="trash-caret">▸</span> 最近删除
          <span id="trash-count" class="trash-count"></span>
        </button>
        <div id="trash-list" class="trash-list" hidden></div>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p><span data-site-name></span></p>
  </footer>

  <div id="toast" class="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" class="toast-undo" type="button">撤销</button>
  </div>

  <script src="theme.js?v=20261123b"></script>

  <script src="config.js?v=20261123b"></script>
  <script src="branding.js?v=20261123b"></script>
  <script src="app.js?v=20261123b"></script>
</body>
</html>
