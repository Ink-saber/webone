<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办簿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="list">

  <header class="site-header">
    <div class="brand">
      <h1 data-site-name>待办簿</h1>
      <p class="subtitle" data-tagline></p>
    </div>
    <div class="user-bar">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="btn-text" type="button">退出</button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="index.html" class="active">清单</a>
    <a href="chat.html"><span data-ai-name>小记</span></a>
  </nav>

  <main>
    <section class="panel">

      <form id="add-form" class="add-form">
        <input id="new-title" type="text" maxlength="100" placeholder="写一件事，按回车添加" required>
        <button id="add-btn" class="btn-primary" type="submit">添加</button>
      </form>

      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索标题或说明">
        <label class="check">
          <input id="only-todo" type="checkbox"> 只看未完成
        </label>
      </div>

      <p id="count" class="count"></p>

      <p id="loading" class="state" hidden>加载中…</p>
      <p id="empty" class="state" hidden>这里还是空的</p>
      <div id="error" class="state error" hidden>
        <p id="error-msg"></p>
        <button id="retry" class="btn-ghost" type="button">重试</button>
      </div>

      <ul id="list" class="list" hidden></ul>

    </section>
  </main>

  <footer class="site-footer">
    <p><span data-site-name></span></p>
  </footer>

  <script src="config.js"></script>
  <script src="branding.js"></script>
  <script src="app.js"></script>
</body>
</html>
