<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日历</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("season")||"spring")}catch(e){document.documentElement.setAttribute("data-theme","spring")}</script>

  <link rel="stylesheet" href="style.css?v=20261119c">
</head>
<body data-page="calendar">

  <header class="site-header">
    <div class="brand">
      <h1 data-site-name>待办簿</h1>
      <p class="subtitle" data-tagline></p>
    </div>
    <div class="user-bar">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="btn-text" type="button">退出</button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="index.html">清单</a>
    <a href="calendar.html" class="active">日历</a>
    <a href="chat.html"><span data-ai-name>小记</span></a>
  </nav>

  <main>
    <section class="panel calendar-card">

      <div class="cal-head">
        <div class="cal-nav">
          <button id="cal-prev" class="cal-arrow" type="button" aria-label="上个月">‹</button>
          <span id="cal-title" class="cal-title"></span>
          <button id="cal-next" class="cal-arrow" type="button" aria-label="下个月">›</button>
        </div>
        <button id="cal-today" class="btn-text" type="button">今天</button>
      </div>

      <div id="cal-error" class="state error" hidden>
        <p id="cal-error-msg"></p>
        <button id="cal-retry" class="btn-ghost" type="button">重试</button>
      </div>

      <div id="cal-grid" class="cal-grid"></div>

      <div class="day-panel">
        <div class="day-head">
          <span id="day-title" class="day-head-title"></span>
          <a id="day-add" class="btn-text" href="new.html">＋ 当天添加</a>
        </div>
        <div id="day-list" class="day-list"></div>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p><span data-site-name></span></p>
  </footer>

  <script src="theme.js?v=20261119c"></script>

  <script src="config.js?v=20261119c"></script>
  <script src="branding.js?v=20261119c"></script>
  <script src="calendar.js?v=20261119c"></script>
</body>
</html>
