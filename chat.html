<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("season")||"spring")}catch(e){document.documentElement.setAttribute("data-theme","spring")}</script>

  <link rel="stylesheet" href="style.css?v=20261120b">
</head>
<body data-page="chat">

  <header class="site-header">
    <div class="brand">
      <h1 data-ai-name>小记</h1>
      <p class="subtitle" data-ai-tagline></p>
    </div>
    <div class="user-bar">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="btn-text" type="button">退出</button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="index.html">清单</a>
    <a href="calendar.html">日历</a>
    <a href="chat.html" class="active"><span data-ai-name>小记</span></a>
    <a href="guide.html">指南</a>
  </nav>

  <main>
    <section class="panel chat-panel">

      <div class="chat-toolbar">
        <span id="turn-count" class="turn-count"></span>
        <button id="new-chat-btn" class="btn-text" type="button">新对话</button>
      </div>

      <div id="messages" class="messages">
        <p class="state" id="chat-hint"></p>
      </div>

      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="2" maxlength="1000"
                  placeholder="Enter 发送，Shift + Enter 换行"></textarea>
        <div class="chat-actions">
          <span id="chat-status" class="chat-status"></span>
          <button id="stop-btn" class="btn-ghost" type="button" hidden>停止生成</button>
          <button id="send-btn" class="btn-primary" type="submit">发送</button>
        </div>
      </form>

    </section>
  </main>

  <footer class="site-footer">
    <p><span data-site-name></span></p>
  </footer>

  <script src="theme.js?v=20261120b"></script>

  <script src="config.js?v=20261120b"></script>
  <script src="branding.js?v=20261120b"></script>
  <script src="chat.js?v=20261120b"></script>
</body>
</html>
